{% extends "base.html" %}

{% block title %}Connexion — Excel sur mesure{% endblock %}

{% block content %}
<section class="hero">
    <h2>Se connecter</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
    <p>Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
</section>
{% endblock %}
