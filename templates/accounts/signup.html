{% extends "base.html" %}

{% block title %}Inscription — Excel sur mesure{% endblock %}

{% block content %}
<section class="hero">
    <h2>Créer un compte</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Créer mon compte</button>
    </form>
    <p>Vous avez déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</section>
{% endblock %}
