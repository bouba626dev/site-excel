{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Excel sur mesure{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">Excel sur mesure</h1>
            <p class="tagline">Votre outil Excel, généré pour votre activité</p>
            {% if request.user.is_authenticated %}
                <nav class="site-nav" aria-label="Navigation du compte">
                    <a href="{% url 'history' %}">Historique</a>
                    <a href="{% url 'logout' %}">Déconnexion</a>
                </nav>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 — Plateforme Excel personnalisé</p>
        </div>
    </footer>
</body>
</html>
